version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
      radix:
        patterns:
          - "@radix-ui/*"
      fumadocs:
        patterns:
          - "fumadocs-*"
